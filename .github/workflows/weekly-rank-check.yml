name: Weekly rank check

on:
  schedule:
    - cron: "17 3 * * 1"   # Every Monday 08:47 IST (03:17 UTC)
  workflow_dispatch:        # "Run workflow" button for a manual run

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests openpyxl

      - name: Check rankings
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python check_rankings.py

      - name: Save results to the repo
        run: |
          git config user.name "rank-bot"
          git config user.email "rank-bot@users.noreply.github.com"
          git add results/rankings.xlsx
          git commit -m "Rankings $(date +%F)" || echo "No changes"
          git push

      - name: Email the spreadsheet
        if: ${{ env.MAIL_USERNAME != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Weekly keyword rankings
          to: ${{ secrets.MAIL_TO }}
          from: Rank Tracker <${{ secrets.MAIL_USERNAME }}>
          body: This week's Google rankings are attached (sheet "Latest"; full history in "History").
          attachments: results/rankings.xlsx
